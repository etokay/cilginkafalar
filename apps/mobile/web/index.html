<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ÇILGIN KAFALAR! Aile ve arkadaşlarla oynanan mobil parti oyunu. Prototip sürümü.">
  <meta name="theme-color" content="#231A57">
  <meta name="robots" content="noindex">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Çılgın Kafalar">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=pof1">
  <link rel="icon" type="image/png" href="favicon.png?v=pof1">
  <title>ÇILGIN KAFALAR!</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;height:100%;background:#231A57}
    #yukleniyor{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#C9B8FF;font-weight:800;font-size:15px}
    #yukleniyor b{color:#FFD343;font-size:30px;letter-spacing:1px}
    #yukleniyor i{width:46px;height:46px;border-radius:50%;border:6px solid rgba(201,184,255,.25);border-top-color:#FFD343;animation:d 1s linear infinite}
    @keyframes d{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#yukleniyor i{animation:none}}
  </style>
</head>
<body>
  <div id="yukleniyor" aria-live="polite"><img src="icons/Icon-192.png?v=pof1" width="112" height="112" alt="" style="border-radius:26px"><b>ÇILGIN KAFALAR!</b><i></i><span>Oyun yükleniyor</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('yukleniyor'); if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
